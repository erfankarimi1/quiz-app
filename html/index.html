<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC&family=Indie+Flower&family=Caveat&display=swap" rel="stylesheet">   
    <title>Quiz App</title>
</head>
<body>
    <main class="container  --container">
    <header class="header --header">
        <h1 class="headertext --headertext">Quiz App</h1>
    </header>
   
  
    <section class="question-cards">
            <section class="card">
                    <button class="bookmark --bookmark">      
                        <img src="../assets/icons/bookmark.svg" alt="bookmark-">
                    </button>
                    <h1 class="question">Which language structures a web page?</h1>
                    <button class="show-answer"> Show Answer</button>
                    <div class="answers">
                        <span>HTML</span>
                        <span>Python</span>
                        <span>SQL</span>

                    </div>
            </section>
            <section class="card">
                    <button class="bookmark --bookmark">      
                        <img src="../assets/icons/bookmark.svg" alt="bookmark-">
                    </button>
                    <h1 class="question">Which CSS property changes text color?</h1>
                    <button class="show-answer"> Show Answer</button>
                      <div class="answers">
                        <span>font-size</span>
                        <span>color</span>
                        <span>margin</span>
                    </div>
            </section>
            <section class="card">
                    <button class="bookmark --bookmark">      
                        <img src="../assets/icons/bookmark.svg" alt="bookmark-">
                    </button>
                    <h1 class="question">Which HTML tag creates a hyperlink?</h1>
                    <button class="show-answer"> Show Answer</button>
                        <div class="answers">
                        <span>&lt;a&gt;</span>
                        <span>&lt;p&gt;</span>
                        <span>&lt;img&gt;</span>
                    </div>
            </section>
            <section class="card">
                    <button class="bookmark --bookmark">      
                        <img src="../assets/icons/bookmark.svg" alt="bookmark-">
                    </button>
                    <h1 class="question">Which layout system is useful for one-dimensional layouts?</h1>
                    <button class="show-answer"> Show Answer</button>
                         <article class="answers --answers">
                        <span>Flexbox</span>
                        <span>Tables</span>
                        <span>Floats</span>
                    </article>
                    </div>
            </section>
    </section>

    <footer>
         
    <nav class="nav --nav ">
        <a class="nav-buttons" href="index.html"><img src="../assets/icons/house.svg" alt="">Home</a>
         <a class="nav-buttons" href="bookmarks.html"><img src="../assets/icons/bookmark.svg" alt="">Book Marked</a>
          <a class="nav-buttons" href="profilepage.html"><img src="../assets/icons/user.svg" alt="">Profile</a>
    </nav>
    </footer>





 </main>  
</body>
</html>
